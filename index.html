<script>
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const fx=(x,d=2)=>(Number.isFinite(x)?x.toFixed(d):"–");
function RNG(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SEED0=(Date.now()&0xffffff)>>>0;
const rng=(k)=>{let h=SEED0;for(const c of String(k))h=Math.imul(h^c.charCodeAt(0),16777619);return RNG(h)};
const EXPS=[];
const UNITS=[
 {n:1,t:"Limit tests",need:4,sub:"Any 4 experiments"},
 {n:2,t:"Preparation of inorganic pharmaceuticals",need:3,sub:"Any 3 experiments"},
 {n:3,t:"Tests for purity",need:2,sub:"Any 2 experiments"},
 {n:4,t:"Assay of inorganic compounds (with standardization of titrant)",need:5,sub:"Any 5 experiments"}];
const REFS=["Bentley & Driver, Textbook of Pharmaceutical Chemistry (OUP)","Vogel, Textbook of Quantitative Chemical Analysis (Pearson)","Beckett & Stenlake, Practical Pharmaceutical Chemistry, Parts I & II (Athlone Press)","Kennedy, Analytical Chemistry: Principles (Saunders)","Schroff, Inorganic Pharmaceutical Chemistry (Oxford Book Co.)","Indian Pharmacopoeia Commission, Indian Pharmacopoeia"];

/* ===== UNIT 1: LIMIT TESTS ===== */
const SAMP=(a)=>a.map(([n,d,r])=>({n,d,r}));
const MODOPT=(acid)=>["Dissolve directly in water","Neutralise: dissolve in dilute "+acid+" (acid stops effervescence)","Shake with water and filter; use the filtrate","Dissolve, acidify with dilute "+acid+" and filter off the liberated organic acid; use the filtrate","Decolourise (e.g. boil with ethanol), filter and use the filtrate"];
const MODSAMP=SAMP([["Sodium bicarbonate","Alkaline; effervesces with acid (type: alkaline)",0.45],["Insoluble antacid powder","Does not dissolve in water (type: insoluble)",1.6],["Sodium benzoate","Salt of an organic acid; acid precipitates benzoic acid (type: organic acid salt)",0.75],["Potassium permanganate","Deep purple solution masks turbidity (type: coloured)",1.3]]);
const MODRIGHT=[1,2,3,4];
const VQ=(q,o,a,e)=>({q,o,a,e});

EXPS.push({id:"L1",u:1,t:"Limit test and modified limit test for chloride (IP)",
 aim:"To perform the limit test for chloride and the modified limit test for chloride on pharmaceutical substances, and decide whether each sample complies.",
 th:`<p>Chloride is limited because it comes from raw materials and water used in manufacture. The test is a <b>comparison</b>: the opalescence produced by the sample is compared with that of a standard containing a known, permitted amount of chloride, both treated identically in matched Nessler cylinders.</p>
 <div class="rx">Cl⁻ + Ag⁺ → AgCl↓ (white opalescence)</div>
 <ul><li><b>Dilute nitric acid</b> keeps carbonate, phosphate and similar anions from precipitating with silver, and gives a cleaner AgCl suspension. Hydrochloric acid cannot be used (it adds chloride).</li><li><b>Standard:</b> 1 mL of 0.05845 % w/v NaCl (= 0.01 M) contains 0.5845 mg NaCl = <b>0.355 mg Cl⁻</b>.</li><li><b>Limit</b> (%) = 0.355 mg ÷ weight of sample (mg) × 100; for 1.00 g this is 0.0355 %.</li></ul>
 <h3>Modified limit test</h3><p>Used when the sample cannot simply be dissolved in water: <b>alkaline</b> substances (dissolve in acid to stop effervescence), <b>insoluble</b> substances (extract with water, filter), <b>salts of organic acids</b> such as sodium benzoate (acidify and filter off the water-insoluble acid) and <b>coloured</b> substances (decolourise first, e.g. potassium permanganate boiled with ethanol).</p>
 <p class="small mut">Reagent strengths follow standard IP-based practical manuals (silver nitrate is 0.1 M in the IP and 5 % w/v in several manuals). Always confirm against the current IP monograph.</p>`,
 req:"Nessler cylinders (2, matched, 50 mL), glass rods, pipettes, sample, 0.05845 % w/v NaCl, dilute HNO₃, AgNO₃ solution, distilled water, black background.",
 steps:["Weigh the specified quantity of sample and dissolve it in water in a Nessler cylinder (Test).","Put 1 mL of 0.05845 % NaCl in another cylinder (Standard).","Add 10 mL of dilute nitric acid to each; dilute both to 50 mL.","Add 1 mL of silver nitrate solution to each; stir immediately.","Stand 5 min protected from light; view against a black background.","Opalescence of Test not greater than Standard → complies."],
 sim:{kind:"limit",key:"cl",label:"chloride",std:0.35457,stdTxt:"1 mL of 0.05845 % w/v NaCl = 0.355 mg Cl⁻",unit:"mg Cl⁻",wt:1,effect:"white",bg:"black",wait:"5 min",
  steps:[
   {t:"Test: dissolve 1.00 g of sample in water in a Nessler cylinder. Standard: pipette 1 mL of 0.05845 % NaCl into a second cylinder.",f:0.1},
   {t:"Add 10 mL of dilute acid to each cylinder.",ask:{q:"Which acid do you add before silver nitrate?",o:["Dilute nitric acid","Dilute hydrochloric acid","Dilute sulphuric acid"],ok:0,why:"HCl would add chloride; H₂SO₄ can precipitate silver sulphate. HNO₃ suppresses Ag₂CO₃/Ag₃PO₄ and gives a clean AgCl opalescence."},f:0.3},
   {t:"Dilute each cylinder to 50 mL with chloride-free distilled water.",f:0.5},
   {t:"Add 1 mL of silver nitrate solution to each and stir immediately with a glass rod.",f:0.7},
   {t:"Stand for 5 minutes, protected from light.",wait:1,f:1}],
  samples:SAMP([["Sample A","White crystalline powder",0.45],["Sample B","White crystalline powder",0.82],["Sample C","White crystalline powder",1.25],["Sample D","Off-white powder",2.4]]),
  mod:{samples:MODSAMP,opts:MODOPT("nitric acid"),right:MODRIGHT,pen:0.9}},
 viva:[VQ("Why is dilute nitric acid, not hydrochloric acid, added in the chloride limit test?",["HNO₃ is a stronger oxidant","HCl would itself add chloride","HNO₃ dissolves AgCl"],1,"HCl would introduce chloride. Nitric acid also prevents precipitation of silver carbonate, phosphate etc."),VQ("Which standard is used in the IP chloride limit test?",["1 mL of 0.05845 % w/v NaCl","10 mL of 0.1 N HCl","1 mL of 5 % KCl"],0,"0.05845 % NaCl is 0.01 M, i.e. 0.355 mg chloride per mL."),VQ("Sodium benzoate is tested by the modified test because…",["it is coloured","acidification liberates insoluble benzoic acid that must be filtered off","it is insoluble in water"],1,"Organic acid salts give water-insoluble acids on acidification, which would add turbidity of their own.")]});

EXPS.push({id:"L2",u:1,t:"Limit test and modified limit test for sulphate (IP)",
 aim:"To perform the limit test and modified limit test for sulphate and decide whether given samples comply.",
 th:`<p>Sulphate is detected as a fine white turbidity of barium sulphate and compared with a standard containing a permitted amount of sulphate.</p>
 <div class="rx">SO₄²⁻ + Ba²⁺ → BaSO₄↓ (white turbidity)</div>
 <ul><li><b>Dilute HCl</b> prevents precipitation of barium carbonate or phosphate.</li><li><b>Barium sulphate reagent</b> (BaCl₂ + sulphate-free alcohol + a little K₂SO₄) – the small amount of sulphate provides seed crystals so that the turbidity is uniform and reproducible; alcohol limits supersaturation and gives finer particles.</li><li><b>Standard:</b> 1 mL of 0.1089 % w/v K₂SO₄ = 1.089 mg K₂SO₄ = <b>0.600 mg SO₄²⁻</b>.</li></ul>
 <p>The modified test uses the same pre-treatments as the modified chloride test (alkaline, insoluble, organic-acid salt, coloured samples).</p>
 <p class="small mut">Confirm quantities with the current IP monograph before examination use.</p>`,
 req:"Nessler cylinders, 0.1089 % w/v K₂SO₄, dilute HCl, barium sulphate reagent, distilled water, black background.",
 steps:["Dissolve the specified quantity of sample in water in a Nessler cylinder (Test).","Put 1 mL of 0.1089 % K₂SO₄ in another cylinder (Standard).","Add 2 mL dilute HCl to each; dilute both to 45 mL.","Add 5 mL barium sulphate reagent to each; stir immediately.","Stand 5 min; compare turbidity against a black background."],
 sim:{kind:"limit",key:"so4",label:"sulphate",std:0.6003,stdTxt:"1 mL of 0.1089 % w/v K₂SO₄ = 0.600 mg SO₄²⁻",unit:"mg SO₄²⁻",wt:1,effect:"white",bg:"black",wait:"5 min",
  steps:[
   {t:"Test: dissolve 1.00 g of sample in water in a Nessler cylinder. Standard: pipette 1 mL of 0.1089 % K₂SO₄ into a second cylinder.",f:0.1},
   {t:"Add 2 mL of dilute acid to each cylinder.",ask:{q:"Which acid is added before the barium reagent?",o:["Dilute hydrochloric acid","Dilute sulphuric acid","Dilute nitric acid"],ok:0,why:"Dilute HCl keeps BaCO₃/BaPO₄ in solution. H₂SO₄ would add sulphate, which defeats the test."},f:0.25},
   {t:"Dilute each cylinder to 45 mL with sulphate-free water.",f:0.4},
   {t:"Add 5 mL of barium sulphate reagent to each and stir immediately.",f:0.65},
   {t:"Stand for 5 minutes.",wait:1,f:1}],
  samples:SAMP([["Sample A","White powder",0.5],["Sample B","White powder",0.85],["Sample C","White powder",1.2],["Sample D","White powder",2.2]]),
  mod:{samples:MODSAMP,opts:MODOPT("hydrochloric acid"),right:MODRIGHT,pen:0.9}},
 viva:[VQ("Why does the barium sulphate reagent contain a little potassium sulphate?",["To act as seed crystals for uniform turbidity","To adjust the pH","To dissolve BaSO₄"],0,"Seed crystals give reproducible, uniform turbidity."),VQ("Which acid is used in the sulphate limit test?",["Dilute HCl","Dilute H₂SO₄","Dilute HNO₃"],0,"HCl avoids adding sulphate and prevents BaCO₃ precipitation."),VQ("What does the alcohol in the reagent do?",["Reduces supersaturation, giving finer particles","Acts as an indicator","Reacts with sulphate"],0,"Alcohol reduces solubility changes and gives a finer, more even precipitate.")]});

EXPS.push({id:"L3",u:1,t:"Limit test for iron (IP)",
 aim:"To perform the limit test for iron by the thioglycollic acid method and judge whether a sample complies.",
 th:`<p>Iron is limited because it catalyses oxidation and degradation of drugs. In ammoniacal solution, iron reacts with thioglycollic acid to give a pink-to-deep-reddish-purple ferrous thioglycollate complex.</p>
 <div class="rx">2 Fe³⁺ + 2 HSCH₂COOH → 2 Fe²⁺ + (SCH₂COOH)₂ + 2 H⁺<br>Fe²⁺ + thioglycollate (NH₃, pH ≈ 9) → purple complex</div>
 <ul><li><b>Citric acid (iron-free)</b> complexes other metals (Ca, Mg…) so that no hydroxide precipitates when ammonia is added.</li><li><b>Ammonia</b> makes the solution alkaline, where the colour develops.</li><li>The colour <b>fades in air</b> (oxidation), so compare promptly.</li><li><b>Standard iron solution:</b> 0.1726 g ferric ammonium sulphate per litre = 20 ppm Fe; 2 mL = <b>0.040 mg Fe</b>.</li></ul>
 <p class="small mut">Quantities follow standard IP-based practical manuals; confirm with the current IP.</p>`,
 req:"Nessler cylinders, standard iron solution (20 ppm Fe), 20 % w/v iron-free citric acid, thioglycollic acid, iron-free ammonia solution, distilled water, white background.",
 steps:["Dissolve the specified quantity of sample in 20 mL water in a Nessler cylinder (Test).","Put 2 mL of standard iron solution and 20 mL water in another cylinder (Standard).","Add 2 mL of 20 % citric acid and 0.1 mL thioglycollic acid to each; mix.","Make alkaline with iron-free ammonia; dilute to 50 mL.","Stand 5 min; compare the colour against a white background promptly."],
 sim:{kind:"limit",key:"fe",label:"iron",std:0.03998,stdTxt:"2 mL of standard iron solution (20 ppm Fe) = 0.040 mg Fe",unit:"mg Fe",wt:1,effect:"purple",bg:"white",wait:"5 min",
  steps:[
   {t:"Test: dissolve 1.00 g of sample in 20 mL water. Standard: 2 mL of standard iron solution + 20 mL water.",f:0.1},
   {t:"Add 2 mL of 20 % citric acid to each cylinder and mix.",ask:{q:"What is the purpose of citric acid here?",o:["It keeps metals such as Ca/Mg in solution when ammonia is added","It reduces Fe³⁺","It makes the solution acidic for colour development"],ok:0,why:"Citric acid complexes interfering metals so hydroxides do not precipitate in the ammoniacal solution."},f:0.3},
   {t:"Add 0.1 mL of thioglycollic acid to each and mix.",f:0.45},
   {t:"Make each solution alkaline with iron-free ammonia and dilute to 50 mL.",f:0.75},
   {t:"Stand for 5 minutes, then compare promptly.",wait:1,f:1}],
  samples:SAMP([["Sample A","White crystalline powder",0.4],["Sample B","White crystalline powder",0.8],["Sample C","Pale powder",1.3],["Sample D","Pale yellow powder",2.5]])},
 viva:[VQ("Which reagent reduces Fe³⁺ and forms the purple complex?",["Thioglycollic acid","Citric acid","Ammonia"],0,"Thioglycollic acid reduces Fe³⁺ to Fe²⁺ and complexes it."),VQ("Why must the colours be compared promptly?",["Colour fades by oxidation in air","The complex precipitates","Ammonia evaporates"],0,"The ferrous complex is oxidised by air and fades."),VQ("Standard iron solution contains…",["20 ppm Fe","20 % Fe","2 ppm Fe"],0,"0.1726 g ferric ammonium sulphate per litre ≈ 20 µg Fe/mL.")]});

EXPS.push({id:"L4",u:1,t:"Limit test for lead (heavy metals, IP)",
 aim:"To perform the limit test for lead (heavy metals expressed as lead) by the sulphide method and judge compliance.",
 th:`<p>Heavy metals (expressed as lead) are limited because of their toxicity. At pH 3–4, lead ions react with hydrogen sulphide to give a dark-brown colloidal lead sulphide, which is compared with a standard lead solution treated identically.</p>
 <div class="rx">Pb²⁺ + H₂S → PbS↓ (dark brown colloid) + 2 H⁺</div>
 <ul><li><b>pH 3–4</b> (acetic acid / ammonia) gives the best colloidal PbS; outside this range colour is lost or other sulphides interfere.</li><li><b>H₂S solution must be freshly prepared</b> – it oxidises on standing.</li><li><b>Standard lead solution:</b> 20 ppm Pb (stock 0.1598 g Pb(NO₃)₂ per litre = 100 ppm, diluted 1 in 5); 2 mL = <b>0.040 mg Pb</b>. For a 2 g sample this corresponds to a 20 ppm limit.</li></ul>
 <p class="small mut">Dilution details differ between manuals; this lab uses 2 mL of 20 ppm Pb. Confirm with the current IP.</p>`,
 req:"Nessler cylinders, standard lead solution (20 ppm), dilute acetic acid, dilute ammonia, freshly prepared H₂S water, pH paper, white background.",
 steps:["Test: take the sample solution (2.00 g in water) in a Nessler cylinder.","Standard: 2 mL standard lead solution + water in another cylinder.","Adjust each to pH 3–4 with acetic acid or ammonia; dilute to 35 mL.","Add 10 mL freshly prepared H₂S solution to each; dilute to 50 mL.","Stand 5 min; compare the brown colour against a white background."],
 sim:{kind:"limit",key:"pb",label:"lead",std:0.04,stdTxt:"2 mL of standard lead solution (20 ppm Pb) = 0.040 mg Pb",unit:"mg Pb",wt:2,effect:"brown",bg:"white",wait:"5 min",
  steps:[
   {t:"Test: dissolve 2.00 g of sample in water (25 mL). Standard: 2 mL standard lead solution + 25 mL water.",f:0.1},
   {t:"Adjust both to pH 3–4 using dilute acetic acid or ammonia.",ask:{q:"Why is the pH set to 3–4?",o:["Colloidal PbS forms best in this range","H₂S is only stable at pH 3–4","To dissolve the sample"],ok:0,why:"At pH 3–4 lead gives a stable colloidal PbS suited to comparison; other pH values lose colour or invite other sulphides."},f:0.35},
   {t:"Dilute both to 35 mL.",f:0.5},
   {t:"Add 10 mL of freshly prepared H₂S solution to each and dilute to 50 mL.",f:0.8},
   {t:"Stand for 5 minutes.",wait:1,f:1}],
  samples:SAMP([["Sample A","White powder",0.35],["Sample B","White powder",0.85],["Sample C","Greyish powder",1.25],["Sample D","Grey powder",2.6]])},
 viva:[VQ("Why is freshly prepared H₂S solution required?",["H₂S oxidises and loses strength on standing","It is a solid","It changes pH"],0,"Old H₂S solution has oxidised to sulphur."),VQ("Optimum pH for the lead sulphide test?",["3–4","7–8","10–11"],0,"Dilute acetic acid / ammonia adjust to pH 3–4."),VQ("Heavy metals in the IP test are expressed as…",["Lead","Iron","Arsenic"],0,"The standard is a lead solution.")]});

EXPS.push({id:"L5",u:1,t:"Limit test for arsenic (Gutzeit method, IP)",
 aim:"To perform the limit test for arsenic by the Gutzeit method and judge compliance by comparing the stain with that of a standard.",
 th:`<p>Arsenic is highly toxic. In the Gutzeit test, arsenic is reduced to arsine gas by nascent hydrogen; arsine turns mercuric chloride paper yellow to brown. The length and depth of the stain are compared with a standard stain made from a known amount of arsenic.</p>
 <div class="rx">H₃AsO₄ + 2 HI → H₃AsO₃ + I₂ + H₂O (KI / SnCl₂ reduce As(V) to As(III))<br>Zn + 2 HCl → ZnCl₂ + 2 [H]<br>H₃AsO₃ + 6 [H] → AsH₃↑ + 3 H₂O<br>AsH₃ + HgCl₂ → yellow-brown stain on the paper</div>
 <ul><li><b>Lead acetate cotton wool</b> in the tube traps hydrogen sulphide, which would otherwise blacken the paper.</li><li>Reaction at about <b>40 °C for 40 min</b>; keep the paper dry.</li><li><b>Standard stain:</b> 1 mL of dilute arsenic solution (1 ppm As) = <b>1 µg As</b>. Test and standard run at the same time; compare immediately.</li></ul>
 <p class="small mut">Use arsenic-free (AsT) reagents. Confirm quantities with the current IP.</p>`,
 req:"Gutzeit apparatus (wide-mouth bottle, delivery tube, lead acetate cotton plug, HgCl₂ paper), arsenic-free HCl, granulated zinc (AsT), KI, stannous chloride acid solution, standard arsenic solution (1 ppm).",
 steps:["Place sample solution (1.00 g) in the bottle; add KI, SnCl₂ acid and 10 g granulated zinc.","Fit immediately the tube with lead acetate cotton plug and HgCl₂ paper.","Keep at about 40 °C for 40 min.","Prepare the standard stain in the same way with 1 mL of dilute arsenic solution.","Compare the stains at once."],
 sim:{kind:"limit",key:"as",label:"arsenic",std:0.001,stdTxt:"1 mL of dilute arsenic solution (1 ppm) = 1 µg As = 0.001 mg",unit:"mg As",wt:1,effect:"stain",bg:"white",wait:"40 min",
  steps:[
   {t:"Test bottle: dissolve 1.00 g of sample in water. Standard bottle: 1 mL of dilute arsenic solution (1 µg As).",f:0.1},

EXPS.push({id:"P1",u:2,t:"Preparation of aluminium hydroxide",
 aim:"To prepare aluminium hydroxide from potash alum and sodium carbonate, calculate the theoretical and percentage yield, and test the product.",

 <div class="rx">2 KAl(SO₄)₂·12H₂O + 3 Na₂CO₃ → 2 Al(OH)₃↓ + K₂SO₄ + 3 Na₂SO₄ + 3 CO₂↑ + 24 H₂O</div>

 <p><b>% yield</b> = (actual yield ÷ theoretical yield) × 100.</p>`,

EXPS.push({id:"T2",u:3,t:"Acid-neutralizing capacity of aluminium hydroxide gel",
 aim:"To determine the acid-neutralizing capacity (ANC) of aluminium hydroxide gel by back titration and express it as mEq per gram.",
 th:`<p>An antacid is judged by how much acid it can neutralise. Aluminium hydroxide reacts with hydrochloric acid, so the capacity is measured by adding a <b>known excess of HCl</b>, letting it react, then <b>back-titrating the leftover acid with NaOH</b> to pH 3.5 (USP ⟨301⟩ conditions).</p>
 <div class="rx">Al(OH)₃ + 3 HCl → AlCl₃ + 3 H₂O</div>
 <ul><li>Conditions: 37 ± 3 °C; add 30.0 mL of 1.0 N HCl to the sample in about 70 mL water; stir exactly 15 min; titrate with 0.5 N NaOH to a stable pH 3.5 within 5 min.</li><li><b>ANC (mEq) = (30.0 × N<sub>HCl</sub>) − (V<sub>NaOH</sub> × N<sub>NaOH</sub>)</b>; express per gram of sample.</li><li>Expected value: 3 mEq per 78.0 mg Al(OH)₃ = 0.0385 mEq/mg. Aluminium hydroxide gel (USP) should give not less than 65 % of this expected value.</li></ul>
 <p class="small mut">The model titration treats the solution as a strong-acid titration; pH near 3.5 changes sharply, so add NaOH dropwise near the end.</p>`,
 req:"Aluminium hydroxide gel, 1.0 N HCl, 0.5 N NaOH, pH meter, magnetic stirrer, 37 °C water bath, burette, balance.",
 steps:["Weigh the gel into a beaker; add 70 mL water; stir 1 min.","Add exactly 30.0 mL of 1.0 N HCl; stir for exactly 15 min at 37 °C.","Titrate the excess HCl with 0.5 N NaOH to a stable pH 3.5.","Calculate mEq of acid consumed per gram."],
 sim:{kind:"anc",samples:[{n:"Batch A",pct:4.0,eff:0.84},{n:"Batch B",pct:4.0,eff:0.58},{n:"Batch C",pct:4.2,eff:0.72}]},
 viva:[VQ("This test is a…",["Back titration","Direct titration of the gel","Precipitation titration"],0,"Excess HCl is added and the leftover is titrated with NaOH."),VQ("End-point pH?",["3.5","7.0","10.0"],0,"Titrate to a stable pH of 3.5."),VQ("Expected ANC of pure Al(OH)₃?",["3 mEq per 78 mg","1 mEq per 78 mg","6 mEq per 78 mg"],0,"Each Al(OH)₃ neutralises 3 H⁺.")]});

EXPS.push({id:"A3",u:4,t:"Assay of copper sulphate by iodometry",
 aim:"To standardise 0.1 M sodium thiosulphate and assay copper sulphate by iodometry.",
 th:`<p>Copper(II) oxidises iodide to iodine (copper(I) iodide precipitates). The iodine liberated is titrated with sodium thiosulphate using starch.</p>

  prep:["Weigh about 0.6 g of CuSO₄·5H₂O accurately; dissolve in 50 mL water with 4 mL acetic acid.","Add 3 g KI (excess); iodine is liberated and CuI precipitates.","Titrate to a pale yellow; add starch; near the end add 2 g KSCN; continue to cream-white."],

EXPS.push({id:"A4",u:4,t:"Assay of calcium gluconate by complexometry",

  prep:["Weigh about 0.8 g of calcium gluconate accurately; dissolve in 150 mL water containing 2 mL of 3 N HCl.","Add about 30 mL of EDTA from the burette while stirring.","Add 15 mL of 1 N NaOH and 300 mg hydroxy naphthol blue; titrate to a blue end point."],

EXPS.push({id:"A5",u:4,t:"Assay of hydrogen peroxide by permanganometry",

EXPS.push({id:"A6",u:4,t:"Assay of sodium benzoate by non-aqueous titration",
 aim:"To standardise 0.1 M perchloric acid and assay sodium benzoate by non-aqueous (acidimetric) titration in glacial acetic acid.",
 th:`<p>Benzoate is far too weak a base to titrate in water. In glacial acetic acid (a protogenic solvent) it behaves as a much stronger base, and perchloric acid in acetic acid is a very strong acid, giving a sharp end point with crystal violet.</p>
 <div class="rx">C₆H₅COONa + HClO₄ → C₆H₅COOH + NaClO₄</div>
 <ul><li><b>Factor:</b> 1 mL of 0.1 M HClO₄ ≡ <b>14.41 mg</b> sodium benzoate (M = 144.11). Pharmacopoeial limit (USP): 99.0–100.5 % (anhydrous basis).</li><li><b>Crystal violet</b>: violet (basic) → blue → blue-green → green (acidic/neutral end point).</li><li>Apparatus must be perfectly dry (water leaches the end point). Run a <b>blank</b> on the solvent.</li></ul>`,
 req:"0.1 M HClO₄ in glacial acetic acid, anhydrous glacial acetic acid, KHP, sodium benzoate, crystal violet, dry burette and flasks.",
 steps:["Standardise HClO₄ with KHP.","Dissolve about 0.25 g sodium benzoate in 50 mL anhydrous glacial acetic acid.","Add crystal violet; titrate to emerald green.","Run a blank; calculate % sodium benzoate."],
 sim:{kind:"titr",trials:[S_HC,{k:"assay",tk:"hclo4",title:"Assay of sodium benzoate",ind:"Crystal violet",col:COL.cv,
  prep:["Weigh about 0.25 g of sodium benzoate accurately; dissolve in 50 mL anhydrous glacial acetic acid.","Add 2 drops of crystal violet solution.","Titrate with 0.1 M HClO₄ to emerald green; repeat with a blank."],
  inp:{l:"Sodium benzoate taken",u:"mg",min:200,max:300,def:250,st:1},eq:144.11,gen:rngs(98.6,100.6),need:(i,h)=>i.a*h.P/100/144.11,blank:{k:"blank",min:0.1,max:0.25},note:"1 mL of 0.1 M HClO₄ ≡ 14.41 mg sodium benzoate.",unitR:"% sodium benzoate"}]},
 viva:[VQ("Why is sodium benzoate titrated in glacial acetic acid?",["Benzoate is too weak a base in water; acetic acid enhances its basicity","Benzoate is insoluble in water","HClO₄ is only soluble in acetic acid"],0,"A protogenic solvent levels basic strength upward."),VQ("End point colour with crystal violet?",["Emerald green","Pink","Colourless"],0,"Violet → blue → blue-green → green."),VQ("Why a blank titration?",["To correct for the solvent/indicator","To standardise","To dry the flask"],0,"Acetic acid and indicator consume a little titrant.")]});

EXPS.push({id:"A7",u:4,t:"Assay of sodium chloride by precipitation titration (modified Volhard)",
 aim:"To standardise 0.1 M ammonium thiocyanate and assay sodium chloride by the modified Volhard method.",
 th:`<p>An excess of standard silver nitrate is added to the chloride; the unreacted silver is back-titrated with ammonium thiocyanate using ferric ammonium sulphate as indicator.</p>
 <div class="rx">Ag⁺ + Cl⁻ → AgCl↓ (white)<br>Ag⁺(excess) + SCN⁻ → AgSCN↓<br>Fe³⁺ + SCN⁻ → [Fe(SCN)]²⁺ (red-brown) – end point</div>
 <ul><li><b>Factor:</b> 1 mL of 0.1 M AgNO₃ ≡ <b>5.844 mg</b> NaCl (M = 58.44).</li><li><b>Nitric acid</b> prevents hydrolysis of Fe³⁺ and interference of carbonate/phosphate.</li><li><b>Modification:</b> AgCl is more soluble than AgSCN, so thiocyanate would slowly react with the AgCl and the colour would fade. Shaking with <b>nitrobenzene</b> (or filtering off AgCl) coats the precipitate and prevents this.</li><li>Calculation: mmol Cl⁻ = mmol Ag⁺ added − mmol SCN⁻ used.</li></ul>`,
 req:"0.1 M AgNO₃ (standardised), 0.1 M NH₄SCN, ferric ammonium sulphate indicator, dilute HNO₃, nitrobenzene, burette.",
 steps:["Standardise NH₄SCN with 0.1 M AgNO₃.","Dissolve about 0.12 g NaCl in 50 mL water; add 5 mL dilute HNO₃ and an accurately measured excess of AgNO₃.","Add 3 mL nitrobenzene and shake vigorously; add ferric alum.","Titrate with NH₄SCN to a permanent reddish-brown; calculate % NaCl."],
 sim:{kind:"titr",trials:[{k:"std",tk:"scn",title:"Standardise 0.1 M NH₄SCN with 0.1 M AgNO₃",ind:"Ferric ammonium sulphate",col:COL.volh,
  prep:["Pipette the stated volume of standard 0.1 M AgNO₃ (F = 1.000) into a flask.","Add 5 mL dilute HNO₃ and 2 mL of ferric ammonium sulphate indicator.","Titrate with NH₄SCN with vigorous shaking to a permanent reddish-brown."],
  inp:{l:"0.1 M AgNO₃ taken",u:"mL",min:20,max:30,def:25,st:0.5},eq:1,need:i=>i.a*0.1,note:"Ag⁺ + SCN⁻ → AgSCN. M(NH₄SCN) = (V × 0.1) ÷ V(NH₄SCN)."},
  {k:"assay",tk:"scn",title:"Assay of sodium chloride",ind:"Ferric ammonium sulphate",col:COL.volh,
  prep:["Weigh about 0.12 g of NaCl accurately; dissolve in 50 mL water.","Add 5 mL dilute HNO₃ and an excess of standard 0.1 M AgNO₃ (volume below).","Add 3 mL nitrobenzene; shake until the AgCl coagulates; add 2 mL ferric alum.","Titrate the excess Ag⁺ with NH₄SCN to a permanent reddish-brown."],
  inp:{l:"NaCl taken",u:"mg",min:100,max:150,def:120,st:1},inp2:{l:"0.1 M AgNO₃ added",u:"mL",min:10,max:50,def:30,st:0.5},eq:58.44,gen:rngs(98.6,100.8),
  need:(i,h,j)=>j.a*0.1-i.a*h.P/100/58.44,
  acts:[{id:"hno3",l:"Add 5 mL dilute HNO₃ + 2 mL ferric ammonium sulphate",must:1,err:0.2,why:"No nitric acid: Fe³⁺ hydrolyses and the colour is unreliable (+0.2 mL)."},{id:"nitro",l:"Add 3 mL nitrobenzene and shake",must:1,err:0.6,why:"No nitrobenzene: SCN⁻ reacts with AgCl and the colour fades, so too much titrant is used (+0.6 mL)."}],
  res:(V,M,i,j)=>{const cl=j.a*0.1-V*M;const mg=cl*58.44;return{pct:mg/i.a*100,lab:"% NaCl",extra:"Cl⁻ = "+fx(cl,3)+" mmol (Ag⁺ added − SCN⁻ used)"}},note:"1 mL of 0.1 M AgNO₃ ≡ 5.844 mg NaCl. Excess AgNO₃ must be more than the chloride present.",unitR:"% NaCl"}]},
 viva:[VQ("Why is nitrobenzene added?",["To coat AgCl so SCN⁻ cannot convert it to AgSCN","To dissolve AgCl","As an indicator"],0,"AgCl is more soluble than AgSCN."),VQ("Why is the Volhard titration done in nitric acid?",["Prevents hydrolysis of Fe³⁺","To oxidise chloride","To precipitate AgCl"],0,"In neutral solution Fe³⁺ forms Fe(OH)₃."),VQ("Indicator?",["Ferric ammonium sulphate","Starch","Crystal violet"],0,"Fe³⁺ gives red-brown [Fe(SCN)]²⁺.")]});

EXPS.push({id:"T3",u:3,t:"Determination of potassium iodate and iodine in potassium iodide",
 aim:"To determine the free iodine and the iodate present as impurities in potassium iodide by thiosulphate titration.",
 th:`<p>Potassium iodide can oxidise on storage, giving traces of free iodine and iodate. Both are determined by thiosulphate titration of iodine.</p>
 <div class="rx">I₂ + 2 S₂O₃²⁻ → 2 I⁻ + S₄O₆²⁻ (free iodine, neutral solution)<br>IO₃⁻ + 5 I⁻ + 6 H⁺ → 3 I₂ + 3 H₂O (iodate, only after acidifying)<br>3 I₂ + 6 S₂O₃²⁻ → 6 I⁻ + 3 S₄O₆²⁻</div>
 <ul><li><b>Step 1 (free iodine):</b> dissolve KI in freshly boiled, cooled water; titrate with 0.01 M thiosulphate, adding starch near the end.</li><li><b>Step 2 (iodate):</b> to the same solution add dilute H₂SO₄; the iodate liberates iodine from the excess iodide (blue with starch); titrate again.</li><li><b>Factors (0.01 M thiosulphate, derived from stoichiometry):</b> 1 mL ≡ <b>1.269 mg I₂</b>; 1 mL ≡ <b>0.3567 mg KIO₃</b> (1 mol KIO₃ ≡ 6 mol S₂O₃²⁻).</li><li>Iodate does not react in neutral solution, so the two determinations are independent.</li></ul>
 <p class="small mut">Impurity levels in the model samples are teaching values; pharmacopoeial KI limits for iodate are given as qualitative tests in the IP.</p>`,
 req:"KI, 0.01 M sodium thiosulphate, dilute H₂SO₄, starch, freshly boiled and cooled water, burette.",
 steps:["Dissolve about 5 g KI in 50 mL freshly boiled and cooled water.","Titrate any free iodine with 0.01 M thiosulphate (starch near the end).","Add 2 mL dilute H₂SO₄ to the same solution; titrate the iodine liberated by iodate.","Calculate % w/w of I₂ and KIO₃."],
 sim:{kind:"titr",trials:[{k:"assay",tk:"thio01",title:"Part 1: free iodine in potassium iodide",ind:"Starch",col:iodo("#f4fbfb","Colourless"),
  prep:["Dissolve about 5 g of KI in 50 mL freshly boiled and cooled water.","Titrate with 0.01 M thiosulphate until pale yellow; add starch; titrate until colourless."],
  inp:{l:"KI taken",u:"mg",min:4000,max:6000,def:5000,st:10},eq:126.9,gen:rngs(0.03,0.08),need:(i,h)=>i.a*h.P/100/253.81*2,acts:[{id:"starch",l:"Add starch solution",starch:1}],
  res:(V,M,i)=>{const mg=V*M*126.9;return{pct:mg/i.a*100,lab:"% w/w I₂",extra:"I₂ = "+fx(mg,2)+" mg in "+fx(i.a/1000,2)+" g KI"}},note:"1 mL of 0.01 M thiosulphate ≡ 1.269 mg I₂.",unitR:"% w/w I₂",dec:3},
  {k:"assay",tk:"thio01",title:"Part 2: iodate in potassium iodide",ind:"Starch",col:iodo("#f4fbfb","Colourless"),
  prep:["Use a fresh sample as in Part 1 (or continue with the same solution after Part 1).","Add 2 mL of dilute sulphuric acid: iodate liberates iodine (blue colour with starch).","Titrate with 0.01 M thiosulphate until the blue colour disappears."],
  inp:{l:"KI taken",u:"mg",min:4000,max:6000,def:5000,st:10},eq:35.67,gen:rngs(0.02,0.06),need:(i,h)=>i.a*h.P/100/214.0*6,
  acts:[{id:"acid",l:"Add 2 mL dilute H₂SO₄ (liberates iodine from iodate)",must:1,block:1,why:"In neutral solution iodate does not react."},{id:"starch",l:"Add starch solution",starch:1,early:0}],
  res:(V,M,i)=>{const mg=V*M*35.67;return{pct:mg/i.a*100,lab:"% w/w KIO₃",extra:"KIO₃ = "+fx(mg,2)+" mg in "+fx(i.a/1000,2)+" g KI"}},note:"1 mL of 0.01 M thiosulphate ≡ 0.3567 mg KIO₃.",unitR:"% w/w KIO₃",dec:3}]},
 viva:[VQ("Why must the KI be dissolved in freshly boiled and cooled water?",["Dissolved CO₂/O₂ would liberate iodine from iodide","To dissolve more KI","To adjust pH"],0,"Air oxidises iodide to iodine."),VQ("Why is the solution acidified before the second titration?",["Iodate only liberates iodine from iodide in acid","To destroy starch","To remove thiosulphate"],0,"IO₃⁻ + 5I⁻ + 6H⁺ → 3I₂ + 3H₂O."),VQ("Mole ratio KIO₃ : S₂O₃²⁻?",["1 : 6","1 : 2","1 : 1"],0,"Each iodate gives 3 I₂, each needing 2 thiosulphate.")]});
EXPS.sort((a,b)=>a.u-b.u||(a.id<b.id?-1:1));
/* ===== GLOBAL STATE ===== */
const S={sel:null,tab:"aim",done:{},rec:[],st:{},M:{},hm:{},name:"",roll:""};
const EX=id=>EXPS.find(e=>e.id===id);
function addRec(id,line){const e=EX(id);S.rec=S.rec.filter(r=>!(r.id===id&&r.k===line.k));S.rec.push(Object.assign({id,title:e.t,u:e.u},line));S.done[id]=1}
const msgH=m=>m?`<div class="${m.c||"note"}">${m.t}</div>`:"";

/* ===== LIMIT TEST ENGINE ===== */
function limInit(e){const L=e.sim,r=rng(e.id);return{s:0,mode:"std",pre:null,step:0,ask:null,mist:0,waited:false,bg:L.bg,dec:null,w:L.wt,msg:null,j:[0,1,2,3].map(()=>1+(r()-0.5)*0.1)}}
const SIMS=e=>S.st[e.id]||(S.st[e.id]=e.sim.kind==="limit"?limInit(e):{});
function limCur(e){const L=e.sim,st=SIMS(e),list=st.mode==="mod"?L.mod.samples:L.samples,sm=list[st.s],wrong=st.mode==="mod"&&st.pre!==null&&st.pre!==L.mod.right[st.s];
 const rT=sm.r*st.j[st.s]*(st.w/L.wt);const rObs=rT+(wrong?L.mod.pen:0);return{list,sm,wrong,rT,rObs}}
const fI=r=>1-Math.exp(-1.1*r);
function limSVG(e,st,c){const L=e.sim,n=L.steps.length,fin=st.step>=n-1,tf=st.waited?1:(fin?0.25:0);
 const lastF=st.step>0?L.steps[st.step-1].f:0,lvl=st.step===0?0:0.18+0.78*lastF;
 const bgc=st.bg==="black"?"#0b0b0d":"#f7f7f4";
 const hz=(r)=>{const f=fI(r)*tf;
  if(L.effect==="white")return st.bg==="black"?`rgba(255,255,255,${0.9*f})`:`rgba(110,120,130,${0.6*f})`;
  if(L.effect==="purple")return`hsla(${330-45*f},70%,${70-30*f}%,${0.2+0.75*f})`;
  return`hsla(28,60%,${55-30*f}%,${0.12+0.82*f})`};
 const base=st.bg==="black"?"rgba(130,170,210,0.16)":"rgba(205,225,240,0.35)";
 if(L.effect==="stain"){const strip=(x,r,lab)=>{const f=fI(r)*tf,hh=14+38*Math.min(r,3.2)*tf;return`<rect x="${x}" y="30" width="46" height="190" rx="4" fill="#fbfbf8" stroke="#bbb"/><rect x="${x+4}" y="${216-hh}" width="38" height="${hh}" rx="3" fill="hsl(${52-26*f},${50+30*f}%,${82-44*f}%)" opacity="${tf?1:0}"/><text x="${x+23}" y="244" text-anchor="middle" font-size="13" fill="#444">${lab}</text>`};
  return`<svg viewBox="0 0 360 256" width="100%" style="max-width:380px;background:#fff;border-radius:10px"><text x="180" y="18" text-anchor="middle" font-size="12" fill="#666">Mercuric chloride paper strips after the test</text>${strip(80,c.rObs,"Test")}${strip(234,1,"Standard")}</svg>`}
 const cyl=(x,r,lab,tint)=>{const hh=Math.round(176*lvl);return`<rect x="${x}" y="30" width="70" height="190" rx="8" fill="none" stroke="#9aa" stroke-width="2"/>${hh>0?`<rect x="${x+3}" y="${217-hh}" width="64" height="${hh}" rx="4" fill="${tint||base}"/><rect x="${x+3}" y="${217-hh}" width="64" height="${hh}" rx="4" fill="${hz(r)}"/>`:""}<text x="${x+35}" y="244" text-anchor="middle" font-size="13" fill="${st.bg==="black"?"#ddd":"#444"}">${lab}</text><text x="${x+35}" y="26" text-anchor="middle" font-size="10" fill="#889">50 mL</text>`};
 const tint=c.wrong&&c.sm.d.includes("coloured")?"rgba(150,20,140,0.4)":null;
 return`<svg viewBox="0 0 360 256" width="100%" style="max-width:380px;border-radius:10px;background:${bgc}">${cyl(70,c.rObs,"Test",tint)}${cyl(220,1,"Standard")}</svg>`}
function limHTML(e){const L=e.sim,st=SIMS(e),c=limCur(e),n=L.steps.length,hasMod=!!L.mod,pre=st.mode==="mod"&&st.pre===null,started=st.step>0;
 let h=`<div class="note"><b>Standard:</b> ${L.stdTxt}. Specified quantity of sample: <b>${L.wt.toFixed(2)} g</b>. Permitted limit at that weight: <b>${fx(L.std/(L.wt*1000)*100,4)} %</b> (${fx(L.std/L.wt*1000,0)} ppm).</div>`;
 if(hasMod)h+=`<div class="tabs"><button class="${st.mode==="std"?"on":""}" data-a="lmode" data-id="${e.id}" data-v="std">Limit test</button><button class="${st.mode==="mod"?"on":""}" data-a="lmode" data-id="${e.id}" data-v="mod">Modified limit test</button></div>`;
 h+=`<div class="row"><span class="small mut">Sample:</span>${c.list.map((s,i)=>`<button class="${i===st.s?"b":"g"}" data-a="lsamp" data-id="${e.id}" data-v="${i}">${s.n}</button>`).join("")}</div><div class="small mut" style="margin:4px 0">${c.sm.d}</div>`;
 h+=`<div class="row"><label>Weigh sample (g) <input type="number" step="0.01" min="0.1" max="5" value="${st.w}" data-k="w" data-id="${e.id}" ${started?"disabled":""}></label>${started?`<button class="g" data-a="lreset" data-id="${e.id}">Start again</button>`:""}</div>`;
 if(pre){h+=`<h3>How must this sample be prepared before the test?</h3>`+L.mod.opts.map((o,i)=>`<button class="g opt" data-a="lpre" data-id="${e.id}" data-v="${i}">${o}</button>`).join("")+`<div class="small mut">Choose the treatment that suits the sample type.</div>`}
 else{h+=`<h3>Procedure</h3><ol class="steps">`+L.steps.map((s,i)=>`<li class="${i<st.step?"done":""}">${s.t}${i===st.step&&st.ask!==i?` <button class="b" data-a="lstep" data-id="${e.id}">Do this</button>`:""}</li>`).join("")+`</ol>`;
  if(st.ask!==null){const a=L.steps[st.ask].ask;h+=`<div class="note"><b>${a.q}</b>${a.o.map((o,i)=>`<button class="g opt" data-a="lask" data-id="${e.id}" data-v="${i}">${o}</button>`).join("")}</div>`}
  if(st.mode==="mod"&&st.pre!==null&&!c.wrong&&st.step===0)h+=`<div class="okb">Sample prepared appropriately.</div>`;
  if(st.mode==="mod"&&c.wrong&&st.step===0)h+=`<div class="warn">You chose a treatment that may not suit this sample type. Continue if you wish; observe what happens.</div>`}
 h+=msgH(st.msg);
 if(st.step>0||st.waited){h+=`<div class="grid2"><div>${limSVG(e,st,c)}<div class="row small"><span class="mut">View against:</span><button class="${st.bg==="black"?"b":"g"}" data-a="lbg" data-id="${e.id}" data-v="black">Black</button><button class="${st.bg==="white"?"b":"g"}" data-a="lbg" data-id="${e.id}" data-v="white">White</button></div></div><div>`;
  if(st.waited&&st.dec===null)h+=`<h3>Observation</h3><p>Compare the ${L.effect==="stain"?"stains":L.effect==="white"?(e.id==="L1"?"opalescence":"turbidity"):"colour intensity"} of the <b>Test</b> and <b>Standard</b>. Is the Test <b>not greater</b> than the Standard?</p><div class="row"><button class="b" data-a="ldec" data-id="${e.id}" data-v="pass">Complies (Test ≤ Standard)</button><button class="g" data-a="ldec" data-id="${e.id}" data-v="fail">Does not comply (Test &gt; Standard)</button></div>`;
  else if(!st.waited&&st.step===n-1&&st.ask===null)h+=`<p class="mut">The last step is a waiting period (${L.wait}); continue to time-lapse it.</p>`;
  if(st.dec!==null){const ok=(st.dec==="pass")===(c.rT<=1);const mg=c.rT*L.std;
   h+=`<div class="${ok?"okb":"badb"}"><b>${ok?"Correct decision.":"Incorrect decision."}</b> Impurity in the sample: ${fx(mg,3)} ${L.unit} per ${fx(st.w,2)} g (${fx(mg/(st.w*1000)*100,4)} %), against the standard's ${fx(L.std,3)} ${L.unit}. Ratio Test : Standard = <b>${fx(c.rT,2)}</b> → the sample ${c.rT<=1?"<b>complies</b>":"<b>does not comply</b>"}.</div>`;
   if(c.wrong)h+=`<div class="warn">Your pre-treatment did not suit this sample, so the cylinder looked different from the true result (apparent ratio ${fx(c.rObs,2)}). Correct treatment: <b>${L.mod.opts[L.mod.right[st.s]]}</b>.</div>`;
   if(st.mist)h+=`<div class="warn">Mistakes during the procedure: ${st.mist}.</div>`;
   h+=`<button class="g" data-a="lreset" data-id="${e.id}">Test another sample</button>`}
  h+=`</div></div>`}
 return h}
function limAct(a,d){const e=EX(d.id),L=e.sim,st=SIMS(e),n=L.steps.length;
 if(a==="lmode"){S.st[e.id]=Object.assign(limInit(e),{mode:d.v});return}
 if(a==="lsamp"){const m=st.mode;S.st[e.id]=Object.assign(limInit(e),{mode:m,s:+d.v,bg:st.bg});return}
 if(a==="lreset"){S.st[e.id]=Object.assign(limInit(e),{mode:st.mode,s:st.s,bg:st.bg});return}
 if(a==="lpre"){st.pre=+d.v;return}
 if(a==="lbg"){st.bg=d.v;return}
 if(a==="lstep"){const s=L.steps[st.step];if(s.ask&&st.ask===null){st.ask=st.step;st.msg=null;return}
  if(s.wait){st.waited=true;st.step++;st.msg={c:"note",t:"Time-lapse: "+L.wait+" have passed."};return}
  st.step++;st.msg=null;return}
 if(a==="lask"){const s=L.steps[st.ask],ok=+d.v===s.ask.ok;if(ok){st.step=st.ask+1;st.ask=null;st.msg={c:"okb",t:s.ask.why}}else{st.mist++;st.msg={c:"badb",t:"Not quite. "+s.ask.why}}return}
 if(a==="ldec"){st.dec=d.v;const c=limCur(e),ok=(d.v==="pass")===(c.rT<=1);addRec(e.id,{k:st.mode,sample:c.sm.n+(st.mode==="mod"?" (modified test)":""),res:"Ratio test:standard "+fx(c.rT,2)+" → "+(c.rT<=1?"complies":"does not comply"),ok});return}}
/* ===== TITRATION ENGINE ===== */
function trs(e){if(e._trs)return e._trs;const o=[];e.sim.trials.forEach(t=>{o.push(t);if(t.blank)o.push({k:"blank",tk:t.tk,title:"Blank titration for: "+t.title.toLowerCase(),ind:t.ind,col:t.col,prep:["Repeat the titration with exactly the same quantities of all reagents and solvent, but without the sample.","The blank volume is subtracted from the sample titre."],inp:null,blankOf:t})});return e._trs=o}
const trueM=tk=>{if(!(tk in S.hm)){const T=TT[tk],r=rng("M"+tk);S.hm[tk]=T.M*(1+(r()-0.5)*2*T.tol)}return S.hm[tk]};
function tst(e,i){const st=SIMS(e);if(!st.t)st.t=[];if(!st.t[i]){const tr=trs(e)[i],r=rng(e.id+i);st.t[i]={a:tr.inp?tr.inp.def:0,b:tr.inp2?tr.inp2.def:0,V:0,off:0,done:{},rows:[],started:false,errV:0,hid:tr.gen?{P:tr.gen(r)}:{P:100},blankV:tr.blankOf?tr.blankOf.blank.min+(tr.blankOf.blank.max-tr.blankOf.blank.min)*r():0,msg:null,early:false,sub:null,notes:[]}}return st.t[i]}
function veqOf(tr,t){if(tr.k==="blank")return t.blankV;const need=tr.need({a:t.a},t.hid,{a:t.b});if(!(need>0))return null;return need/trueM(tr.tk)+t.errV}
function blankMean(e,tr){if(!tr.blank)return 0;const bi=trs(e).findIndex(x=>x.blankOf===tr),bt=tst(e,bi);return bt.sub?bt.sub.Vm:(bt.rows.length?bt.rows.reduce((s,r)=>s+r.v,0)/bt.rows.length:0)}
function conc(rows){const v=rows.map(r=>r.v);for(let i=v.length-1;i>0;i--)for(let j=i-1;j>=0;j--)if(Math.abs(v[i]-v[j])<=0.101)return{Vm:(v[i]+v[j])/2,pair:[v[j],v[i]]};return null}
const pOf=(V,ve)=>!ve?0:V<ve?V/ve:(V-ve<=0.055?1:1.004+(V-ve-0.055)/ve);
function burSVG(V,off,col){const rd=Math.max(0,V-off),y=20+Math.min(rd,50)*5;
 const ticks=Array.from({length:11},(_,i)=>`<line x1="${95-(i%2?6:10)}" x2="95" y1="${20+i*25}" y2="${20+i*25}" stroke="#778"/>${i%2===0?`<text x="${80-12}" y="${24+i*25}" font-size="10" fill="#667" text-anchor="end">${i*5}</text>`:""}`).join("");
 const hw=Math.min(62,12+Math.max(0,(358-335))*0.77);
 return`<svg viewBox="0 0 230 420" width="100%" style="max-width:250px"><rect x="95" y="14" width="30" height="268" rx="4" fill="rgba(255,255,255,.55)" stroke="#889" stroke-width="2"/><rect x="97" y="${y}" width="26" height="${272-y+10}" fill="#bcd6ee" opacity=".85"/>${ticks}<rect x="104" y="282" width="12" height="14" fill="#667"/><rect x="108" y="296" width="4" height="14" fill="#889"/>
 <path d="M98 322 L98 342 L50 406 Q48 414 58 414 L162 414 Q172 414 170 406 L122 342 L122 322 Z" fill="rgba(255,255,255,.35)" stroke="#889" stroke-width="2"/><path d="M${110-30} 366 L${110+30} 366 L${110+62} 410 L${110-62} 410 Z" fill="${col}"/><text x="205" y="${Math.min(y+4,274)}" font-size="11" fill="#445" text-anchor="end" transform="translate(0 0)"></text></svg>`}
function titHTML(e){const st=SIMS(e),T=trs(e);if(st.ti==null)st.ti=0;const tr=T[st.ti],t=tst(e,st.ti),veq=veqOf(tr,t),TTt=TT[tr.tk],M=S.M[tr.tk];
 let h=`<div class="tabs">${T.map((x,i)=>`<button class="${i===st.ti?"on":""}" data-a="ttrial" data-id="${e.id}" data-v="${i}">${x.k==="std"?"Standardisation":x.k==="blank"?"Blank":(x.title.startsWith("Part")?x.title.split(":")[0]:"Assay")}</button>`).join("")}</div><h3 style="margin-top:0">${tr.title}</h3>`;
 h+=`<div class="grid2"><div><div class="small mut"><b>Titrant:</b> ${TTt.txt}${tr.tk==="thio01"?"":" · <b>Indicator:</b> "+tr.ind}</div><ol class="steps" style="margin:6px 0 0 18px">${tr.prep.map(p=>`<li>${p}</li>`).join("")}</ol>`;
 if(tr.inp){h+=`<div class="row" style="margin-top:8px"><label>${tr.inp.l} (${tr.inp.u}) <input type="number" data-k="a" data-id="${e.id}" value="${t.a}" min="${tr.inp.min}" max="${tr.inp.max}" step="${tr.inp.st}" ${t.started?"disabled":""}></label>${tr.inp2?`<label>${tr.inp2.l} (${tr.inp2.u}) <input type="number" data-k="b" data-id="${e.id}" value="${t.b}" min="${tr.inp2.min}" max="${tr.inp2.max}" step="${tr.inp2.st}" ${t.started?"disabled":""}></label>`:""}</div><div class="small mut">Allowed range ${tr.inp.min}–${tr.inp.max} ${tr.inp.u}${tr.inp.u==="mg"?" (weigh accurately; the balance is assumed exact)":""}.</div>`}
 else h+=`<div class="small mut" style="margin-top:6px">No sample is taken in a blank.</div>`;
 if(tr.acts)h+=`<div class="row" style="margin-top:8px">`+tr.acts.map(a=>{const dis=t.done[a.id]||(a.minV&&t.V<a.minV);return`<button class="${t.done[a.id]?"g":"b"}" ${dis?"disabled":""} data-a="tact" data-id="${e.id}" data-v="${a.id}">${t.done[a.id]?"✓ ":""}${a.l}</button>`}).join("")+`</div>`;
 const p=pOf(t.V,veq),cl=veq?tr.col(p,{done:t.done}):[CL,"Colourless"];const lab=cl[1].split(" – ")[0];
 h+=`<div class="row" style="margin-top:10px"><span class="small mut">Add titrant:</span><button class="g" data-a="tadd" data-id="${e.id}" data-v="10">+10 mL</button><button class="g" data-a="tadd" data-id="${e.id}" data-v="1">+1 mL</button><button class="g" data-a="tadd" data-id="${e.id}" data-v="0.2">+0.2 mL</button><button class="g" data-a="tadd" data-id="${e.id}" data-v="0.05">1 drop (0.05 mL)</button></div>`;
 h+=msgH(t.msg);
 h+=`<div class="row" style="margin-top:8px"><button class="b" data-a="trec" data-id="${e.id}" ${t.V>0?"":"disabled"}>Record burette reading</button><button class="g" data-a="tnew" data-id="${e.id}">New flask</button>${t.V-t.off>30?`<button class="g" data-a="trefill" data-id="${e.id}">Refill burette</button>`:""}</div></div>`;
 h+=`<div style="text-align:center">${burSVG(t.V,t.off,cl[0])}<div class="big">${fx(Math.max(0,t.V-t.off),2)} mL</div><div class="small mut">Burette reading · flask: <b>${lab}</b></div></div></div>`;
 if(t.rows.length){h+=`<h3>Observation table</h3><table><tr><th>#</th><th>Initial (mL)</th><th>Final (mL)</th><th>Titre (mL)</th>${t.rows.some(r=>r.over!=null)?"<th>Beyond true end point</th>":""}</tr>${t.rows.map((r,i)=>`<tr><td>${i+1}</td><td>0.00</td><td>${fx(r.v,2)}</td><td>${fx(r.v,2)}</td><td>${r.over>0.005?"+"+fx(r.over,2)+" mL":r.over<-0.005?fx(r.over,2)+" mL (stopped early)":"at end point"}</td></tr>`).join("")}</table>`;
  const c=conc(t.rows);if(!c)h+=`<div class="note">Repeat until two titres agree within 0.10 mL (concordant).</div>`;
  else h+=calcHTML(e,tr,t,c)}
 return h}
function calcHTML(e,tr,t,c){const Vm=c.Vm,T=TT[tr.tk];let h=`<div class="okb">Concordant titres: ${fx(c.pair[0],2)} and ${fx(c.pair[1],2)} mL → mean = <b>${fx(Vm,2)} mL</b>.</div><h3>Calculation</h3>`;
 if(tr.k==="blank"){t.sub={Vm};return h+`<p>Blank titre = <b>${fx(Vm,2)} mL</b> (subtracted in the assay).</p>`+subBtn(e,tr,t,null)}
 const j={a:t.b},i={a:t.a};
 if(tr.k==="std"){const n=tr.need(i,{P:100},j),Mc=n/Vm,F=Mc/T.M;t.sub={Mc,Vm};S.M[tr.tk]=Mc;

  const t=ancTrue(e,st),mEq=30-st.V*0.5,pct=mEq/t.exp*100;st.sub={mEq,perG:mEq/st.w,exp:t.exp,pct,warn:Math.abs(pH-3.5)>0.15?"Your end point was at pH "+fx(pH,2)+", slightly off 3.5.":""};st.msg=null;
  addRec(e.id,{k:"anc",sample:e.sim.samples[st.b].n,res:fx(mEq/st.w,2)+" mEq/g = "+fx(pct,1)+" % of expected",ok:pct>=65===(t.anc/t.exp>=0.65)})}}

S.vv={};S.dl=null;
const COS=[["CO1","Perform limit tests to detect and identify impurities in pharmaceutical substances.",["L"]],["CO2","Prepare various pharmaceutical inorganic compounds following standard procedures.",["P"]],["CO3","Analyze the significance of quality control in pharmaceutical products and raw materials.",["L","T"]],["CO4","Demonstrate proficiency in titrimetric analysis using different volumetric techniques.",["A","T"]],["CO5","Competence in applying analytical skills to qualitative and quantitative data.",["L","P","T","A"]]];
function navH(){let h=`<button class="${!S.sel&&S.tab!=="rec"?"on":""}" data-a="ui_home">🏠 Course home</button>`;
 UNITS.forEach(u=>{const ex=EXPS.filter(e=>e.u===u.n),d=ex.filter(e=>S.done[e.id]).length;h+=`<h4>Unit ${u.n} · ${u.t} (${u.sub}) · ${d}/${ex.length}</h4>`+ex.map(e=>`<button class="${S.sel===e.id?"on":""}" data-a="ui_go" data-v="${e.id}"><span class="dot ${S.done[e.id]?"d":""}"></span>${e.t}</button>`).join("")});
 return h+`<h4>Practical record</h4><button class="${S.tab==="rec"&&!S.sel?"on":""}" data-a="ui_rec">📒 My record (${S.rec.length})</button>`}
function homeH(){const tot=UNITS.reduce((s,u)=>s+u.need,0),dn=UNITS.reduce((s,u)=>s+Math.min(u.need,EXPS.filter(e=>e.u===u.n&&S.done[e.id]).length),0);
 return`<div class="card"><h2>BP111P – Pharmaceutical Inorganic and Analytical Chemistry (Practical)</h2><div><span class="chip">Core</span><span class="chip">Credit 1</span><span class="chip">L–T–P: – – 3 h/week</span><span class="chip">Max. 45 hours</span><span class="chip">Max. marks 50 (SE 20 · ESE 30)</span></div>
 <p>A virtual laboratory for the B.Pharm practical syllabus. Each experiment has the aim, theory with the real reactions, the procedure, an interactive simulation with calculations, a short viva and an entry in your practical record. The chemistry (molar masses, stoichiometry, equivalence factors, indicator colour changes) is real; the unknown sample values are randomised, so every student gets a different answer.</p>
 <h3>Course objectives</h3><ol><li>Gain practical knowledge on various volumetric titration techniques.</li><li>Learn the principles of volumetric analysis.</li><li>Study the preparation and assessment of inorganic compounds.</li><li>Determine the assay of various inorganic compounds in pharmaceutical use.</li><li>Develop analytical skill for the qualitative and quantitative analysis of various inorganic compounds.</li></ol>
 <h3>Course outcomes and where to practise them</h3><table><tr><th>CO</th><th>Upon completion, the student will be able to…</th><th>Experiments</th></tr>${COS.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${EXPS.filter(e=>c[2].includes(e.id[0])).map(e=>`<a href="#" data-a="ui_go" data-v="${e.id}" style="color:var(--ac)">${e.id}</a>`).join(" ")}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>Syllabus and your progress</h2><div class="pb" style="margin:6px 0 12px"><i style="width:${dn/tot*100}%"></i></div><p class="small mut">${dn} of ${tot} required experiments completed (the syllabus asks for the minimum numbers shown below).</p>`+UNITS.map(u=>{const ex=EXPS.filter(e=>e.u===u.n);return`<h3>${u.n}. ${u.t} <span class="chip">${u.sub}</span></h3><ul>${ex.map(e=>`<li><a href="#" data-a="ui_go" data-v="${e.id}" style="color:var(--ac)">${e.t}</a>${S.done[e.id]?" ✅":""}</li>`).join("")}</ul>`}).join("")+`<h3>Recommended references</h3><ul class="small">${REFS.map(r=>`<li>${r}</li>`).join("")}</ul>
 <div class="note small">Reagent strengths, volumes and limits follow standard IP-based practical manuals and the pharmacopoeial texts consulted while building this lab (IP-style limit tests; USP monographs for bentonite, ANC, calcium gluconate and sodium benzoate). Always check the current edition of the Indian Pharmacopoeia and your institute's manual before using a value in an examination. This lab prepares you for the bench; it does not replace hands-on work.</div></div>`}
function tabsH(e){const T=[["aim","Aim"],["theory","Theory"],["proc","Procedure"],["sim","Simulation"],["viva","Viva"]];return`<div class="tabs">${T.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="ui_tab" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>`}
function vivaH(e){const a=S.vv[e.id]||(S.vv[e.id]=[]);let sc=0;const h=e.viva.map((q,i)=>{const p=a[i],ans=p!=null;if(ans&&p===q.a)sc++;return`<div class="note"><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<button class="${ans&&j===q.a?"b":"g"} opt" data-a="ui_viva" data-v="${i}:${j}" ${ans?"disabled":""}>${o}${ans&&p===j?(j===q.a?" ✓":" ✗"):""}</button>`).join("")}${ans?`<div class="${p===q.a?"okb":"badb"}">${p===q.a?"Correct. ":"Not quite. "}${q.e}</div>`:""}</div>`}).join("");return h+`<p class="mut">Score: ${sc} / ${e.viva.length}</p>`}
function expH(e){let h=`<div class="card"><h2>${e.id} · ${e.t}</h2><div><span class="chip">Unit ${e.u}</span></div>${tabsH(e)}`;
 if(S.tab==="aim")h+=`<h3>Aim</h3><p>${e.aim}</p><h3>Requirements</h3><p>${e.req}</p>`;
 else if(S.tab==="theory")h+=e.th;
 else if(S.tab==="proc")h+=`<h3>Procedure</h3><ol class="steps">${e.steps.map(s=>`<li>${s}</li>`).join("")}</ol><div class="note">Go to the <b>Simulation</b> tab to perform it.</div>`;
 else if(S.tab==="viva")h+=vivaH(e);
 else{const k=e.sim.kind;h+=`<div class="sim">${k==="limit"?limHTML(e):k==="titr"?titHTML(e):k==="prep"?prepHTML(e):k==="bent"?bentHTML(e):ancHTML(e)}</div>`}
 return h+`</div>`}
function recH(){const nm=S.name||"(enter your name above)",rl=S.roll||"";let h=`<div class="card"><h2>Practical record</h2><p>Student: <b>${nm}</b> ${rl?"· Roll no. <b>"+rl+"</b>":""}</p>`;
 if(!S.rec.length)h+=`<p class="mut">Nothing recorded yet. Complete an experiment's simulation and it is entered here automatically.</p>`;
 else h+=`<table><tr><th>Experiment</th><th>Item</th><th>Result</th><th></th></tr>${S.rec.slice().sort((a,b)=>a.u-b.u||(a.id<b.id?-1:1)).map(r=>`<tr><td>${r.id} · ${r.title}</td><td>${r.sample}</td><td>${r.res}</td><td>${r.ok?"✓":"✗"}</td></tr>`).join("")}</table>`;
 h+=`<h3>Syllabus requirement</h3><table><tr><th>Unit</th><th>Required</th><th>Completed</th></tr>${UNITS.map(u=>{const d=EXPS.filter(e=>e.u===u.n&&S.done[e.id]).length;return`<tr><td>${u.n}. ${u.t}</td><td>${u.sub}</td><td>${d} ${d>=u.need?"✅":""}</td></tr>`}).join("")}</table>`;
 if(S.dl)h+=`<div class="row" style="margin-top:12px"><button class="b" data-a="ui_dl" data-v="html">⬇ Download record (HTML)</button><button class="g" data-a="ui_dl" data-v="csv">⬇ Download (CSV)</button></div>`;
 else h+=`<p class="small mut">Downloads are available when this page is opened inside claude.ai.</p>`;return h+`</div>`}
function render(){$("#nav").innerHTML=navH();const m=$("#main");m.innerHTML=S.sel?expH(EX(S.sel)):(S.tab==="rec"?recH():homeH())}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function dl(kind){if(!S.dl)return;const d=new Date().toLocaleDateString("en-IN"),rows=S.rec.slice().sort((a,b)=>a.u-b.u||(a.id<b.id?-1:1));
 try{if(kind==="csv"){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';await S.dl.save({filename:"bp111p-record.csv",data:["Unit,Experiment,Item,Result,Correct"].concat(rows.map(r=>[r.u,q(r.id+" "+r.title),q(r.sample),q(r.res),r.ok?"yes":"no"].join(","))).join("\n")})}
 else await S.dl.save({filename:"bp111p-record.html",data:`<!doctype html><meta charset="utf-8"><title>BP111P practical record</title><style>body{font:14px system-ui;margin:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px 8px;text-align:left}th{background:#e4f2ef}</style><h2>BP111P Pharmaceutical Inorganic and Analytical Chemistry (Practical): record</h2><p>Student: ${esc(S.name||"")} &nbsp; Roll no.: ${esc(S.roll||"")} &nbsp; Date: ${d}</p><table><tr><th>Unit</th><th>Experiment</th><th>Item</th><th>Result</th><th>OK</th></tr>${rows.map(r=>`<tr><td>${r.u}</td><td>${esc(r.id+" "+r.title)}</td><td>${esc(r.sample)}</td><td>${esc(r.res)}</td><td>${r.ok?"✓":"✗"}</td></tr>`).join("")}</table><p style="margin-top:30px">Signature of teacher: ____________________</p>`})}catch(x){}}

 if(a==="ui_home"){S.sel=null;S.tab="home"}else if(a==="ui_rec"){S.sel=null;S.tab="rec"}else if(a==="ui_go"){S.sel=d.v;S.tab="aim";window.scrollTo(0,0)}else if(a==="ui_tab")S.tab=d.v;

 else{const r=ROUTES.find(x=>x.re.test(a));if(r)r.f(a,d)}
 render()});

 if(k==="w"){SIMS(e).w=v}else if(k==="a"||k==="b"){tst(e,SIMS(e).ti||0)[k]=v}else if(k==="rd"){S.st[id].rd=el.value}else if(k==="aw"){S.st[id].w=v}
 else if(k.startsWith("v_")||k.startsWith("o_")){const st=S.st[id],r=k.slice(2);if(k[0]==="v")st.v[r]=v;else st.o[r]=+el.value;const t=$("#ptab");if(t)t.innerHTML=prepTab(e,st)}}
